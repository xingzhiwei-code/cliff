 <!DOCTYPE html>
 <html lang="en">
 <head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>CLI Framework — The terminal-first CLI toolkit</title>
 <style>
   :root {
     --bg: #0a0a0c;
     --bg-card: #0f0f14;
     --bg-code: #0d1117;
     --fg: #d4d4d4;
     --fg-dim: #6b7280;
     --green: #00e676;
     --green-dim: #004d40;
     --cyan: #00bcd4;
     --yellow: #ffd600;
     --red: #ff5252;
     --blue: #448aff;
     --magenta: #e040fb;
     --border: #1e1e2a;
     --radius: 6px;
     --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace;
     --font-sans: 'DM Sans', 'Inter', system-ui, sans-serif;
   }
 
   *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
   html { scroll-behavior: smooth; }
 
   body {
     background: var(--bg);
     color: var(--fg);
     font-family: var(--font-sans);
     line-height: 1.7;
     -webkit-font-smoothing: antialiased;
   }
 
   body::before {
     content: '';
     position: fixed;
     inset: 0;
     background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 230, 118, 0.04), transparent);
     pointer-events: none;
     z-index: 0;
   }
 
   nav {
     position: fixed;
     top: 0;
     left: 0;
     right: 0;
     z-index: 100;
     background: rgba(10, 10, 12, 0.85);
     backdrop-filter: blur(12px);
     border-bottom: 1px solid var(--border);
     padding: 0 24px;
     height: 56px;
     display: flex;
     align-items: center;
     justify-content: space-between;
   }
 
   .nav-brand {
     font-family: var(--font-mono);
     font-size: 15px;
     font-weight: 700;
     color: var(--green);
     display: flex;
     align-items: center;
     gap: 8px;
   }
 
   .nav-brand::before {
     content: '>';
     font-size: 13px;
     opacity: 0.6;
   }
 
   .nav-links {
     display: flex;
     gap: 24px;
     list-style: none;
   }
 
   .nav-links a {
     color: var(--fg-dim);
     text-decoration: none;
     font-size: 13px;
     font-family: var(--font-mono);
     transition: color 0.2s;
   }
 
   .nav-links a:hover { color: var(--green); }
 
   main { position: relative; z-index: 1; }
 
   section { padding: 80px 24px; max-width: 960px; margin: 0 auto; }
 
   .hero {
     padding-top: 160px;
     padding-bottom: 100px;
     text-align: center;
   }
 
   .hero-badge {
     display: inline-block;
     font-family: var(--font-mono);
     font-size: 12px;
     color: var(--green);
     background: rgba(0, 230, 118, 0.08);
     border: 1px solid rgba(0, 230, 118, 0.15);
     padding: 4px 12px;
     border-radius: 20px;
     margin-bottom: 24px;
   }
 
   .hero h1 {
     font-family: var(--font-mono);
     font-size: clamp(36px, 6vw, 64px);
     font-weight: 700;
     color: #fff;
     line-height: 1.1;
     margin-bottom: 16px;
   }
 
   .hero h1 .highlight { color: var(--green); }
 
   .hero p {
     font-size: 18px;
     color: var(--fg-dim);
     max-width: 560px;
     margin: 0 auto 32px;
   }
 
   code { font-family: var(--font-mono); font-size: 0.9em; color: var(--green); }
 
   .terminal-preview {
     background: var(--bg-code);
     border: 1px solid var(--border);
     border-radius: var(--radius);
     padding: 20px 24px;
     font-family: var(--font-mono);
     font-size: 13px;
     text-align: left;
     max-width: 600px;
     margin: 0 auto;
     position: relative;
     overflow: hidden;
   }
 
   .terminal-preview::before {
     content: '\\2022 \\2022 \\2022';
     display: block;
     color: var(--fg-dim);
     font-size: 10px;
     margin-bottom: 14px;
     letter-spacing: 4px;
   }
 
   .terminal-preview .prompt { color: var(--green); }
   .terminal-preview .cmd { color: var(--cyan); }
   .terminal-preview .output { color: var(--fg-dim); }
   .terminal-preview .highlight-t { color: var(--yellow); }
 
   h2 {
     font-family: var(--font-mono);
     font-size: 28px;
     font-weight: 700;
     color: #fff;
     margin-bottom: 12px;
   }
 
   h2::before {
     content: '$ ';
     color: var(--green);
     font-weight: 400;
   }
 
   h3 {
     font-family: var(--font-mono);
     font-size: 18px;
     font-weight: 600;
     color: var(--cyan);
     margin: 32px 0 12px;
   }
 
   .section-desc {
     color: var(--fg-dim);
     font-size: 16px;
     margin-bottom: 32px;
   }
 
   .code-block {
     background: var(--bg-code);
     border: 1px solid var(--border);
     border-radius: var(--radius);
     padding: 20px 24px;
     font-family: var(--font-mono);
     font-size: 13px;
     line-height: 1.6;
     overflow-x: auto;
     margin: 16px 0;
     position: relative;
   }
 
   .code-block .lang-tag {
     position: absolute;
     top: 8px;
     right: 12px;
     font-size: 10px;
     color: var(--fg-dim);
     text-transform: uppercase;
   }
 
   .code-block .kw { color: var(--magenta); }
   .code-block .fn { color: var(--blue); }
   .code-block .str { color: var(--yellow); }
   .code-block .cmt { color: var(--fg-dim); font-style: italic; }
   .code-block .type { color: var(--cyan); }
   .code-block .num { color: var(--green); }
 
   .feature-grid {
     display: grid;
     grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
     gap: 16px;
   }
 
   .feature-card {
     background: var(--bg-card);
     border: 1px solid var(--border);
     border-radius: var(--radius);
     padding: 24px;
     transition: border-color 0.2s;
   }
 
   .feature-card:hover { border-color: rgba(0, 230, 118, 0.3); }
 
   .feature-card .icon {
     font-family: var(--font-mono);
     font-size: 20px;
     color: var(--green);
     margin-bottom: 12px;
   }
 
   .feature-card h4 {
     font-family: var(--font-mono);
     font-size: 14px;
     font-weight: 600;
     color: #fff;
     margin-bottom: 6px;
   }
 
   .feature-card p {
     font-size: 13px;
     color: var(--fg-dim);
     line-height: 1.5;
   }
 
   .comparison { overflow-x: auto; }
 
   .comparison table {
     width: 100%;
     border-collapse: collapse;
     font-family: var(--font-mono);
     font-size: 13px;
   }
 
   .comparison th {
     text-align: left;
     padding: 12px 16px;
     color: var(--fg-dim);
     font-weight: 500;
     border-bottom: 1px solid var(--border);
     font-size: 12px;
     text-transform: uppercase;
     letter-spacing: 0.5px;
   }
 
   .comparison td {
     padding: 10px 16px;
     border-bottom: 1px solid rgba(30, 30, 42, 0.5);
   }
 
   .comparison tr:first-child td { border-bottom: 1px solid var(--border); }
 
   .comparison .check { color: var(--green); }
   .comparison .cross { color: var(--fg-dim); }
   .comparison .highlight-col { color: var(--green); font-weight: 500; }
 
   .api-table {
     width: 100%;
     border-collapse: collapse;
     font-size: 14px;
   }
 
   .api-table th {
     text-align: left;
     padding: 10px 16px;
     color: var(--fg-dim);
     font-family: var(--font-mono);
     font-size: 12px;
     font-weight: 500;
     border-bottom: 1px solid var(--border);
     text-transform: uppercase;
   }
 
   .api-table td {
     padding: 10px 16px;
     border-bottom: 1px solid rgba(30, 30, 42, 0.4);
     font-family: var(--font-mono);
     font-size: 13px;
     vertical-align: top;
   }
 
   .api-table td:first-child { color: var(--cyan); white-space: nowrap; }
   .api-table td:last-child { color: var(--fg-dim); font-family: var(--font-sans); }
 
   .cta { text-align: center; padding: 100px 24px; }
 
   .cta h2 { margin-bottom: 16px; }
   .cta h2::before { content: none; }
 
   .cta .code-block {
     display: inline-block;
     text-align: left;
     margin: 24px auto;
   }
 
   .btn {
     display: inline-block;
     font-family: var(--font-mono);
     font-size: 14px;
     font-weight: 600;
     color: #000;
     background: var(--green);
     padding: 12px 28px;
     border-radius: var(--radius);
     text-decoration: none;
     transition: background 0.2s;
     margin-top: 16px;
   }
 
   .btn:hover { background: #00c853; }
 
   footer {
     border-top: 1px solid var(--border);
     padding: 32px 24px;
     text-align: center;
     font-family: var(--font-mono);
     font-size: 12px;
     color: var(--fg-dim);
   }
 
   footer a { color: var(--green); text-decoration: none; }
 
   @media (max-width: 640px) {
     section { padding: 48px 16px; }
     .hero { padding-top: 120px; }
     .nav-links { gap: 12px; }
     .nav-links a { font-size: 11px; }
   }
 </style>
 </head>
 <body>
 <nav>
   <span class="nav-brand">cli-framework</span>
   <ul class="nav-links">
     <li><a href="#quickstart">Quick Start</a></li>
     <li><a href="#api">API</a></li>
     <li><a href="#features">Features</a></li>
     <li><a href="#compare">Compare</a></li>
   </ul>
 </nav>
